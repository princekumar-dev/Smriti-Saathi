name: smirithi_saathi
description: An offline-first AI companion for elderly wellbeing.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Readable premium type for older adults
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0

  # Local storage
  shared_preferences: ^2.5.3

  # Permissions
  permission_handler: ^12.0.1

  # Connectivity
  connectivity_plus: ^6.1.5

  # Voice / speech
  speech_to_text: ^7.0.0

  # Text to speech
  flutter_tts: ^4.2.3

  # HTTP Client for Backend & MongoDB sync
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/